<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="32" font-weight="bold">추석 연휴에도 쉬지 않는 금융시장</text><text x="64" y="196" font-size="22" fill="#c5d1e7">美국채 10년물 금리, 19년 만에 5%대 진입(9.23)</text><rect x="64" y="240" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="272" font-size="17">美국채 10년물 금리(9.23)</text><text x="88" y="314" font-size="30" font-weight="bold">5.104%</text><text x="88" y="342" font-size="15" fill="#dce3ff">2007.7 이후 최고·19년 2개월만</text><rect x="427" y="240" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="272" font-size="17">10월 추가 인상 가능성</text><text x="451" y="314" font-size="30" font-weight="bold">66.4%</text><text x="451" y="342" font-size="15" fill="#dce3ff">전일 55%·한달전 10%미만</text><rect x="790" y="240" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="272" font-size="17" fill="#101e3c">9월 美 종합PMI</text><text x="814" y="314" font-size="30" font-weight="bold" fill="#101e3c">58.4</text><text x="814" y="342" font-size="15" fill="#1a2c58">8월 56.0→2021.7 이후 최고</text><rect x="64" y="384" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="420" font-size="19">국내 주택담보대출 평균금리(7월, 한국은행)</text><text x="88" y="454" font-size="26" font-weight="bold">연 4.48% · 2년 8개월 만에 최고, 석 달 연속 상승</text><text x="64" y="524" font-size="19" fill="#c5d1e7">가계대출 신규취급액 기준 금리도 연 4.64%로 4월 이후 3개월 연속 올라</text><text x="64" y="554" font-size="19" fill="#c5d1e7">추석 연휴 중 해외 지표 변동은 국내 재개장(28일) 이후 반영될 수 있음</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 美 재무부·S&amp;P글로벌·CME 페드워치·한국은행 자료(2026.9) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 실제 금리·환율은 시장 상황에 따라 달라질 수 있습니다</text></g></svg>
