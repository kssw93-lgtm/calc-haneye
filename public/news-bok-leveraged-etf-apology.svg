<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="32" font-weight="bold">한은 총재, 레버리지 ETF 경고 미흡 사과</text><text x="64" y="196" font-size="22" fill="#c5d1e7">"국민께 송구"…국정감사서 이례적 사과</text><rect x="64" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="268" font-size="17">삼성전자 하락률(7.15 기준)</text><text x="88" y="310" font-size="28" font-weight="bold">-8.96%</text><text x="88" y="338" font-size="15" fill="#dce3ff">5.27 상장 이후</text><rect x="427" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="268" font-size="17">관련 레버리지 ETF 하락률</text><text x="451" y="310" font-size="28" font-weight="bold">-30.66%</text><text x="451" y="338" font-size="15" fill="#dce3ff">기초주식의 3배 넘는 낙폭</text><rect x="790" y="236" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="268" font-size="17" fill="#101e3c">개인 투자한도(추진안)</text><text x="814" y="310" font-size="28" font-weight="bold" fill="#101e3c">20%</text><text x="814" y="338" font-size="15" fill="#1a2c58">금융위, 9.30 발표</text><rect x="64" y="380" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="416" font-size="19">신현송 총재, 정성호 의원 질의에 "단일종목 레버리지 ETF 충분히 경고 못해…국민께 송구" (10.12)</text><text x="88" y="450" font-size="19">한은 6월 금융안정보고서의 '해외유출 방지 효과' 긍정 평가도 "당시 상황 봐선 적절하지 않았다" 인정</text><text x="64" y="524" font-size="19" fill="#c5d1e7">단일종목 레버리지 ETF: 삼성전자·SK하이닉스 등 특정 종목 일간 변동률 2배 추종(5.27 상장)</text><text x="64" y="554" font-size="19" fill="#c5d1e7">이달 초 정부 부처 수장 사과에 이어 중앙은행 총재까지 사과 · 이례적이라는 평가</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 국회 재정경제기획위원회 국정감사·뉴스1 등 보도(2026.10.12) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 특정 금융상품에 대한 투자를 권유하지 않습니다</text></g></svg>
