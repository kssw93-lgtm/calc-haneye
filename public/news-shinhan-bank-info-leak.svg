<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="32" font-weight="bold">신한은행 대출정보 2만건 유출 정황</text><text x="64" y="196" font-size="22" fill="#c5d1e7">금감원 긴급 현장조사·신한은행 대국민 사과 예정</text><rect x="64" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="268" font-size="17">현재까지 파악된 유출 규모</text><text x="88" y="310" font-size="28" font-weight="bold">약 2만건</text><text x="88" y="338" font-size="15" fill="#dce3ff">정확한 규모는 조사 중</text><rect x="427" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="268" font-size="17">유출 경로</text><text x="451" y="306" font-size="22" font-weight="bold">대출모집인 전용 시스템</text><text x="451" y="338" font-size="15" fill="#dce3ff">공식 뱅킹앱·홈페이지 아님</text><rect x="790" y="236" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="268" font-size="17" fill="#101e3c">유출 추정 정보</text><text x="814" y="306" font-size="20" font-weight="bold" fill="#101e3c">주민번호·소득·대출금액</text><text x="814" y="338" font-size="15" fill="#1a2c58">대출 심사·모집 과정 수집분</text><rect x="64" y="380" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="416" font-size="19">9.30 유출 정황 포착 → 10.1 금융위·금감원 긴급회의, 금감원 현장조사 착수</text><text x="88" y="450" font-size="19">신한은행, 당국과 조율해 대국민 사과문 발표 예정 · 로그인 인증 기반 뱅킹서비스 자체 해킹은 아닌 것으로 전해짐</text><text x="64" y="524" font-size="19" fill="#c5d1e7">일각에서는 다른 사이트 유출 계정으로 반복 로그인을 시도하는 '크리덴셜 스터핑' 공격 가능성 제기</text><text x="64" y="554" font-size="19" fill="#c5d1e7">유출 정보로 보이스피싱·대출사기 2차 피해로 이어질 수 있어 사칭 전화·문자 주의 필요</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 금융감독원·신한은행 관련 보도(2026.10.1) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 유출 범위와 경위는 조사 중이며 추가 확인에 따라 달라질 수 있습니다</text></g></svg>
