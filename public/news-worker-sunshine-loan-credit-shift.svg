<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="32" font-weight="bold">근로자햇살론, 절반이 고신용자에게</text><text x="64" y="196" font-size="22" fill="#c5d1e7">5년 새 신용점수 701점 이상 비중 20.4%→51.0%로 역전</text><rect x="64" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="268" font-size="17">701점 이상 비중</text><text x="88" y="310" font-size="28" font-weight="bold">51.0%</text><text x="88" y="338" font-size="15" fill="#dce3ff">2021년 20.4%→지난해 51.0%</text><rect x="427" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="268" font-size="17">600점 이하 비중</text><text x="451" y="310" font-size="28" font-weight="bold">8.5%</text><text x="451" y="338" font-size="15" fill="#dce3ff">2021년 35.5%→지난해 8.5%</text><rect x="790" y="236" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="268" font-size="17" fill="#101e3c">전체 공급 규모</text><text x="814" y="306" font-size="24" font-weight="bold" fill="#101e3c">3조4,577억원</text><text x="814" y="338" font-size="15" fill="#1a2c58">2021년(3조4,597억원)과 거의 동일</text><rect x="64" y="380" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="416" font-size="19">701점 이상 공급액: 7,060억원 → 1조7,641억원 (+1조원 이상 증가)</text><text x="88" y="450" font-size="19">600점 이하 공급액: 1조2,281억원 → 2,922억원 (4분의 1 미만으로 감소)</text><text x="64" y="524" font-size="19" fill="#c5d1e7">국회예산정책처, 국정감사 자료로 공개 · 서민금융진흥원 보증·금융회사 실행 정책서민금융 상품</text><text x="64" y="554" font-size="19" fill="#c5d1e7">전체 공급 규모는 그대로인데 저신용자 몫이 고신용자 쪽으로 옮겨간 '신용점수 인플레' 현상</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 국회예산정책처 국정감사 자료·서울경제 등 보도(2026.10.6~7) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 실제 신청 자격과 한도는 서민금융진흥원 최신 공지에 따라 다를 수 있습니다</text></g></svg>
