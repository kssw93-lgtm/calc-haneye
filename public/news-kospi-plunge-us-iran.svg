<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스 (정정)</text><text x="64" y="150" font-size="32" font-weight="bold">코스피, 반도체 랠리 타고 7000 재탈환</text><text x="64" y="196" font-size="22" fill="#c5d1e7">마이크론 실적 서프라이즈·9월 수출 역대 최대 겹쳐</text><rect x="64" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="268" font-size="17">코스피 10.1 종가</text><text x="88" y="310" font-size="28" font-weight="bold">6,971.35</text><text x="88" y="338" font-size="15" fill="#dce3ff">전일比 +133.31(+1.95%)</text><rect x="427" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="268" font-size="17">코스피 10.2 종가</text><text x="451" y="310" font-size="28" font-weight="bold">7,003.74</text><text x="451" y="338" font-size="15" fill="#dce3ff">전일比 +32.39(+0.46%)</text><rect x="790" y="236" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="268" font-size="17" fill="#101e3c">9월 반도체 수출</text><text x="814" y="310" font-size="28" font-weight="bold" fill="#101e3c">603억달러</text><text x="814" y="338" font-size="15" fill="#1a2c58">역대 최대, 전년比 +262.8%</text><rect x="64" y="380" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="416" font-size="19">마이크론 4분기 매출 542억9,000만달러·EPS 33.42달러 어닝서프라이즈 → 삼성전자 +2.79%, SK하이닉스 +3.21%</text><text x="88" y="450" font-size="19">9월 수출 1,209억달러로 역대 최대(+83.5%) · 반도체 수출 사상 첫 600억달러 돌파 · 기관 이틀 연속 순매수</text><text x="64" y="524" font-size="19" fill="#c5d1e7">코스닥도 10.1 4.48% 급등한 894.29 마감 · 코스피는 2거래일 연속 7000선 지켜</text><text x="64" y="554" font-size="19" fill="#c5d1e7">※ 최초 게재 기사의 사실관계 오류(美·이란 충돌 급락설)를 바로잡아 다시 제작한 인포그래픽입니다</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 한국거래소(KRX)·산업통상자원부·마이크론 실적발표 관련 보도(2026.10.1~2) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 특정 종목 투자를 권유하지 않습니다</text></g></svg>
