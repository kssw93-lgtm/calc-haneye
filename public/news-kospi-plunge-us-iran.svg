<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="32" font-weight="bold">코스피, 美·이란 재충돌에 3.99% 급락</text><text x="64" y="196" font-size="22" fill="#c5d1e7">종전 9일 만에 무력 충돌 재개·국제유가 급등</text><rect x="64" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="268" font-size="17">코스피 10.2 종가</text><text x="88" y="310" font-size="28" font-weight="bold">6,562.72</text><text x="88" y="338" font-size="15" fill="#dce3ff">전일比 -273.08(-3.99%)</text><rect x="427" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="268" font-size="17">브렌트유(12월물)</text><text x="451" y="310" font-size="28" font-weight="bold">102.31달러</text><text x="451" y="338" font-size="15" fill="#dce3ff">전일比 +4.37%</text><rect x="790" y="236" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="268" font-size="17" fill="#101e3c">美 10년물 국채금리</text><text x="814" y="310" font-size="28" font-weight="bold" fill="#101e3c">5.298%</text><text x="814" y="338" font-size="15" fill="#1a2c58">2002년 이후 24년만 최고권</text><rect x="64" y="380" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="416" font-size="19">미군, 호르무즈해협 이란 라라크섬 로켓발사대 타격 → 이란 "휴전 위반" 규정, 즉각 보복 예고</text><text x="88" y="450" font-size="19">삼성전자 25만500원(-4.02%) · SK하이닉스 161만3000원(-4.73%) · 외국인 1.9조·기관 2.0조 순매도</text><text x="64" y="524" font-size="19" fill="#c5d1e7">美·이란 종전 양해각서 체결 9일 만에 재충돌 · 美 중동 병력·항모전단 증파, 中 석유제품 수출 중단 겹쳐 유가 압박</text><text x="64" y="554" font-size="19" fill="#c5d1e7">코스닥도 803.98(-2.10%)로 3거래일 연속 하락</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 한국거래소(KRX)·국제유가·美 국채금리 관련 보도(2026.10.1~2) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 특정 종목 투자를 권유하지 않습니다</text></g></svg>
