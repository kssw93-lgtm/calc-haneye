<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="38" font-weight="bold">추석 밥상물가 잡기, 정부 총동원</text><text x="64" y="196" font-size="24" fill="#c5d1e7">폭염發 채소·과일값 급등에 역대 최대 지원</text><rect x="64" y="240" width="500" height="88" rx="8" fill="#3863f5"/><text x="88" y="280" font-size="20">농축수산물 할인지원</text><text x="88" y="314" font-size="30" font-weight="bold">1,930억원</text><rect x="588" y="240" width="548" height="88" rx="8" fill="#8299d4"/><text x="612" y="280" font-size="20">온누리상품권 환급 한도</text><text x="612" y="314" font-size="30" font-weight="bold">최대 4만원</text><rect x="64" y="352" width="1072" height="72" rx="8" fill="#1a2c58"/><text x="88" y="396" font-size="24">19대 성수품 18만5,000톤 공급(역대 최대) · 유류세 인하 11월 말까지 연장</text><text x="64" y="462" font-size="22" fill="#c5d1e7">9.16~20 전국 300개 전통시장, 국산 농축산물 구매액 30% 환급(최대 2만원)</text><text x="64" y="496" font-size="22" fill="#c5d1e7">수산물 환급 합산 시 최대 4만원 · 참여 시장은 사전 확인 필요</text><text x="64" y="580" font-size="19" fill="#c5d1e7">출처: 당정협의회·농림축산식품부 2026.09.18 발표 · 자체 제작</text><text x="64" y="608" font-size="19" fill="#c5d1e7">정보 제공용 · 세부 시행 방식은 지자체·전통시장별로 다를 수 있습니다</text></g></svg>
