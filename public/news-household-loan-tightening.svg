<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="40" font-weight="bold">5대銀 가계대출, 반년 만에 감소</text><text x="64" y="200" font-size="26" fill="#c5d1e7">9월 14일 기준 781조7,932억원</text><rect x="64" y="248" width="500" height="88" rx="8" fill="#3863f5"/><text x="88" y="288" font-size="20">8월말 대비</text><text x="88" y="322" font-size="30" font-weight="bold">3,260억원 ↓</text><rect x="588" y="248" width="548" height="88" rx="8" fill="#8299d4"/><text x="612" y="288" font-size="20">주택담보대출</text><text x="612" y="322" font-size="30" font-weight="bold">5,893억원 ↓</text><rect x="64" y="360" width="1072" height="72" rx="8" fill="#1a2c58"/><text x="88" y="404" font-size="24">가계대출 총량 관리 목표 1.5% → 3.0%로 상향(8.13 대책)</text><text x="64" y="470" font-size="22" fill="#c5d1e7">KB국민은행, 16일부터 마이너스통장 한도 5,000만원 일괄 제한</text><text x="64" y="504" font-size="22" fill="#c5d1e7">정책대출 이관 효과 제외 시 실질 잔액은 소폭 증가</text><text x="64" y="580" font-size="19" fill="#c5d1e7">출처: 은행권 집계 2026.09.14 기준 · 자체 제작</text><text x="64" y="608" font-size="19" fill="#c5d1e7">정보 제공용 · 대출 한도·조건은 은행별로 다르니 반드시 개별 확인하세요</text></g></svg>
