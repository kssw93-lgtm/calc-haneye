<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="36" font-weight="bold">추석 앞두고 소비자 피해 전방위 점검</text><text x="64" y="196" font-size="24" fill="#c5d1e7">9개 부처 합동점검 9.14~22 · 1차 위반부터 영업정지</text><rect x="64" y="240" width="500" height="88" rx="8" fill="#3863f5"/><text x="88" y="272" font-size="18">인천 수산물 원산지 단속</text><text x="88" y="308" font-size="27" font-weight="bold">16개 업소 적발</text><rect x="588" y="240" width="548" height="88" rx="8" fill="#8299d4"/><text x="612" y="272" font-size="18">항공서비스 피해구제 3년간</text><text x="612" y="308" font-size="27" font-weight="bold">7,438건 (연 37%↑)</text><rect x="64" y="352" width="1072" height="72" rx="8" fill="#1a2c58"/><text x="88" y="396" font-size="22">항공권 계약해제·위약금 과다청구 58.4% 최다 · OTA 구매 시 이중 수수료 주의</text><text x="64" y="462" font-size="22" fill="#c5d1e7">신고: 바가지요금 지역번호+120·1330 / 소비자 피해 상담 1372</text><text x="64" y="496" font-size="22" fill="#c5d1e7">중국산 낙지·해삼을 국내산으로 표시한 사례 등 적발</text><text x="64" y="580" font-size="19" fill="#c5d1e7">출처: 행정안전부·한국소비자원·공정거래위원회 발표 · 자체 제작</text><text x="64" y="608" font-size="19" fill="#c5d1e7">정보 제공용 · 특정 업체·서비스 이용을 권유하지 않습니다</text></g></svg>
