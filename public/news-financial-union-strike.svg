<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="36" font-weight="bold">금융노조, 추석 넘기고 2차 총파업 예고</text><text x="64" y="196" font-size="24" fill="#c5d1e7">23일 현재 타결 소식 없이 9.30 총파업 그대로 진행</text><rect x="64" y="240" width="500" height="88" rx="8" fill="#3863f5"/><text x="88" y="272" font-size="18">노조 임금인상 요구</text><text x="88" y="308" font-size="27" font-weight="bold">6% vs 사측 2.5%</text><rect x="588" y="240" width="548" height="88" rx="8" fill="#8299d4"/><text x="612" y="272" font-size="18">9.4 1차 총파업 집회 참여</text><text x="612" y="308" font-size="27" font-weight="bold">약 3만명</text><rect x="64" y="352" width="1072" height="72" rx="8" fill="#1a2c58"/><text x="88" y="396" font-size="24">핵심 쟁점: 주 4.5일제 도입 · 국책은행 지방이전 반대 · 정년연장</text><text x="64" y="462" font-size="22" fill="#c5d1e7">2차 총파업은 추석 연휴(9.24~27) 직후인 9.30일로 예정</text><text x="64" y="496" font-size="22" fill="#c5d1e7">1차 총파업 당시 은행 영업 차질은 제한적이었음</text><text x="64" y="580" font-size="19" fill="#c5d1e7">출처: 전국금융산업노동조합·금융산업사용자협의회 관련 보도 · 자체 제작</text><text x="64" y="608" font-size="19" fill="#c5d1e7">정보 제공용 · 협상 경과에 따라 세부 일정이 바뀔 수 있습니다</text></g></svg>
