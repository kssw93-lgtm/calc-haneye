<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="152" font-size="44" font-weight="bold">제2차 국민참여성장펀드</text><text x="64" y="216" font-size="30">판매 예정 2026.09.30 → 10.15</text><text x="64" y="260" font-size="22" fill="#c5d1e7">10영업일 · 물량 소진 시 조기 마감 가능</text><rect x="64" y="308" width="870" height="70" rx="8" fill="#3863f5"/><rect x="934" y="308" width="174" height="70" rx="8" fill="#8299d4"/><text x="88" y="354" font-size="26">국민 모집 6,000억 원</text><text x="64" y="431" font-size="25">후순위 재정 1,200억 원 + 국민 모집액 = 총 7,200억 원</text><text x="64" y="484" font-size="22" fill="#c5d1e7">위 금액은 2차 기준 · 1·2차 합계 조성 목표와 구분</text><text x="64" y="566" font-size="19" fill="#c5d1e7">출처: 금융위원회 2026.09.08 발표 · 자체 제작</text><text x="64" y="600" font-size="19" fill="#c5d1e7">정보 제공용 · 원금 보장 상품을 의미하지 않습니다</text></g></svg>
