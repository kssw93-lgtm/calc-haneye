<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="34" font-weight="bold">연휴 끝, 이번 주 금융 일정 체크리스트</text><text x="64" y="196" font-size="22" fill="#c5d1e7">추석 연휴(9.24~27) 동안 미뤄진 결제가 28일 한꺼번에</text><rect x="64" y="236" width="256" height="150" rx="8" fill="#3863f5"/><text x="86" y="272" font-size="24" font-weight="bold">9.28(월)</text><text x="86" y="308" font-size="17">카드값·대출 원리금</text><text x="86" y="334" font-size="17">보험료·통신료·공과금</text><text x="86" y="360" font-size="17" font-weight="bold">한꺼번에 출금</text><rect x="336" y="236" width="256" height="150" rx="8" fill="#3863f5"/><text x="358" y="272" font-size="24" font-weight="bold">9.29(화)</text><text x="358" y="308" font-size="17">23일에 판</text><text x="358" y="334" font-size="17">주식·ETF 매도대금</text><text x="358" y="360" font-size="17" font-weight="bold">예수금 입금</text><rect x="608" y="236" width="256" height="150" rx="8" fill="#8299d4"/><text x="630" y="272" font-size="24" font-weight="bold" fill="#101e3c">9.30(수)</text><text x="630" y="308" font-size="17" fill="#101e3c">금융노조</text><text x="630" y="334" font-size="17" fill="#101e3c">2차 총파업 예고</text><text x="630" y="360" font-size="17" font-weight="bold" fill="#101e3c">창구 업무 미리</text><rect x="880" y="236" width="256" height="150" rx="8" fill="#8299d4"/><text x="902" y="272" font-size="24" font-weight="bold" fill="#101e3c">10.5 · 10.9</text><text x="902" y="308" font-size="17" fill="#101e3c">대체공휴일·한글날</text><text x="902" y="334" font-size="17" fill="#101e3c">결제일이 걸리면</text><text x="902" y="360" font-size="17" font-weight="bold" fill="#101e3c">6일·12일로 연기</text><rect x="64" y="410" width="1072" height="72" rx="8" fill="#1a2c58"/><text x="88" y="454" font-size="21">23일 장 마감 뒤 공시 91건(전체 452건의 20.1%) · 28일 개장 전 보유 종목 공시 확인</text><text x="64" y="524" font-size="19" fill="#c5d1e7">연휴 때문에 늦춰진 결제는 연체료·연체기록 없음 · 단, 잔액 부족으로 출금 실패하면 실제 연체</text><text x="64" y="554" font-size="19" fill="#c5d1e7">연휴 중 만기 예금은 28일 지급(연휴 기간 이자 포함) · 만기 대출은 28일까지 연체이자 없이 상환</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 금융위원회 추석 연휴 금융이용 안내, 한국거래소 공시 집계 보도(2026.9) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 실제 출금 시점은 금융회사·상품별로 다를 수 있습니다</text></g></svg>
