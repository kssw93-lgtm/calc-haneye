<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="34" font-weight="bold">기준금리 3.00%, 이자 부담은 9개월 뒤 본격화</text><text x="64" y="196" font-size="22" fill="#c5d1e7">한은, 7·8월 연속 인상(2.75%→3.00%) 후폭풍 경고</text><rect x="64" y="240" width="500" height="96" rx="8" fill="#3863f5"/><text x="88" y="272" font-size="18">0.25%p 인상 시 연간 이자부담</text><text x="88" y="312" font-size="26" font-weight="bold">+7조원(가계 3.3조·기업 3.7조)</text><rect x="588" y="240" width="548" height="96" rx="8" fill="#8299d4"/><text x="612" y="272" font-size="18">연체율 상승폭 최대 시점</text><text x="612" y="312" font-size="26" font-weight="bold">취약차주·중기 9개월 vs 전체 15개월</text><rect x="64" y="360" width="1072" height="72" rx="8" fill="#1a2c58"/><text x="88" y="404" font-size="22">소득 하위 20% 가구 47.5%, 예·적금보다 변동금리 부채가 더 많아(2025.3말 기준)</text><text x="64" y="470" font-size="20" fill="#c5d1e7">대출금리는 인상 후 약 5개월 뒤 가장 크게 상승</text><text x="64" y="500" font-size="20" fill="#c5d1e7">3억원 변동금리 대출 예시: 0.25%p 인상 시 연 이자 약 75만원 증가</text><text x="64" y="580" font-size="19" fill="#c5d1e7">출처: 한국은행 금융안정 상황(2026.9) · 자체 제작</text><text x="64" y="608" font-size="19" fill="#c5d1e7">정보 제공용 · 실제 대출 조건에 따라 부담 규모는 달라질 수 있습니다</text></g></svg>
