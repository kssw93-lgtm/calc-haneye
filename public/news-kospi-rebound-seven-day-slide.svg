<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="32" font-weight="bold">코스피, 7거래일 폭락 끝에 반등</text><text x="64" y="196" font-size="22" fill="#c5d1e7">전날 7.57% 급락 딛고 장중 3%대 상승</text><rect x="64" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="268" font-size="17">10.15 종가</text><text x="88" y="310" font-size="28" font-weight="bold">5,554.22</text><text x="88" y="338" font-size="15" fill="#dce3ff">전일比 -454.59(-7.57%)</text><rect x="427" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="268" font-size="17">10.16 장중 고점</text><text x="451" y="310" font-size="28" font-weight="bold">5,745.36</text><text x="451" y="338" font-size="15" fill="#dce3ff">전일比 +3.44%(장중 기준)</text><rect x="790" y="236" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="268" font-size="17" fill="#101e3c">10월2일 대비 낙폭</text><text x="814" y="310" font-size="28" font-weight="bold" fill="#101e3c">-20.7%</text><text x="814" y="338" font-size="15" fill="#1a2c58">7,003.74 → 5,554.22</text><rect x="64" y="380" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="416" font-size="19">10.15 하루 만에 시가총액 약 410조원 증발 · 올해 10번째 서킷브레이커 · 외국인 3조6천억 순매도</text><text x="88" y="450" font-size="19">10.16 개인·기관 저가매수 반등 주도 · 삼성전자 한때 +3.57% · 외국인은 9거래일째 순매도 지속</text><text x="64" y="524" font-size="19" fill="#c5d1e7">7거래일 연속 하락은 약 2년 만에 최장 · 종가 기준 4월 7일 이후 최저 수준까지 하락</text><text x="64" y="554" font-size="19" fill="#c5d1e7">배경: 美 인플레이션 우려·AI 투자 수익성 의구심 · 일부 증권사 지지선은 5,300선 부근으로 전망</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 한국거래소·디지털데일리·뉴스핌 등 보도(2026.10.15~16) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 10.16 수치는 장중 기준이며 종가는 반영되지 않았습니다</text></g></svg>
