<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="32" font-weight="bold">채무조정 재신청 3만명 육박</text><text x="64" y="196" font-size="22" fill="#c5d1e7">8개월 만에 작년 전체의 82.6% 도달…'회전문' 논란</text><rect x="64" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="268" font-size="17">올해(1~8월) 재신청자</text><text x="88" y="310" font-size="28" font-weight="bold">2만7,864명</text><text x="88" y="338" font-size="15" fill="#dce3ff">신용회복위원회 집계</text><rect x="427" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="268" font-size="17">작년 연간 재신청자</text><text x="451" y="310" font-size="28" font-weight="bold">3만3,718명</text><text x="451" y="338" font-size="15" fill="#dce3ff">2025년 전체 기준</text><rect x="790" y="236" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="268" font-size="17" fill="#101e3c">작년 대비 도달률</text><text x="814" y="310" font-size="28" font-weight="bold" fill="#101e3c">82.6%</text><text x="814" y="338" font-size="15" fill="#1a2c58">8개월 만에 (연말까지 4개월 남음)</text><rect x="64" y="380" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="416" font-size="19">채무조정 3단계: 신속채무조정(연체 30일↓) · 프리워크아웃(31~89일) · 개인워크아웃(90일↑)</text><text x="88" y="450" font-size="19">금융당국, 취약차주 재기 지원과 도덕적 해이 차단 위한 세부 기준 연말까지 순차 발표 예정</text><text x="64" y="524" font-size="19" fill="#c5d1e7">한 번 감면·유예 혜택을 받고도 상환 계획을 못 지켜 다시 구제를 요청하는 사례 증가</text><text x="64" y="554" font-size="19" fill="#c5d1e7">성실 상환자 박탈감 vs 저소득·중소득층 경제난 장기화라는 현실적 요인 함께 지적돼</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 신용회복위원회 자료·파이낸셜뉴스·헤럴드경제·서울경제 등 보도(2026.10.5) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 제도 개선안 세부 내용은 추후 발표에 따라 달라질 수 있습니다</text></g></svg>
