<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="32" font-weight="bold">10월 1일부터 결혼해도 대출 그대로</text><text x="64" y="196" font-size="22" fill="#c5d1e7">정책대출 '결혼 페널티' 해소·청년 전세대출 만39세로 확대</text><rect x="64" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="268" font-size="17">보금자리론 개별소득 기준</text><text x="88" y="310" font-size="28" font-weight="bold">7,000만원↓</text><text x="88" y="338" font-size="15" fill="#dce3ff">부부 중 한 명만 충족해도 가능</text><rect x="427" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="268" font-size="17">디딤돌대출 개별소득 기준</text><text x="451" y="310" font-size="28" font-weight="bold">6,000만원↓</text><text x="451" y="338" font-size="15" fill="#dce3ff">부부합산 대신 개별심사</text><rect x="790" y="236" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="268" font-size="17" fill="#101e3c">버팀목전세자금 개별소득 기준</text><text x="814" y="310" font-size="28" font-weight="bold" fill="#101e3c">5,000만원↓</text><text x="814" y="338" font-size="15" fill="#1a2c58">10.1 시행</text><rect x="64" y="380" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="416" font-size="19">청년 전세대출 대상 연령 만 34세 → 39세로 확대(10.1 시행)</text><text x="88" y="450" font-size="19">10.1부터 시외·고속버스 운임 9%↑(2023.7 이후 3년만) · KTX 등 예매 가능기간 2개월 전으로 확대</text><text x="64" y="524" font-size="19" fill="#c5d1e7">기존: 결혼하면 부부합산 소득으로 심사돼 대출 탈락하는 '결혼 페널티' 발생</text><text x="64" y="554" font-size="19" fill="#c5d1e7">변경 후: 부부 중 한 명이라도 개별 소득기준을 충족하면 대출 허용</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 금융위원회·국토교통부 8·13 부동산 시장 안정 종합대책(2026.8) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 실제 대출 가능 여부는 주택가격·순자산 등 다른 요건도 함께 충족해야 합니다</text></g></svg>
