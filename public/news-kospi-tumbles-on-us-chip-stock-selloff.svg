<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="32" font-weight="bold">코스피, 美 반도체주 급락 여파로 3%대 급락 출발</text><text x="64" y="196" font-size="22" fill="#c5d1e7">외국인·기관 저가매수에 낙폭은 줄여</text><rect x="64" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="268" font-size="17">10.19 개장가</text><text x="88" y="310" font-size="28" font-weight="bold">5,488.41</text><text x="88" y="338" font-size="15" fill="#dce3ff">전일比 -179.64(-3.17%)</text><rect x="427" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="268" font-size="17">장중 낙폭 축소</text><text x="451" y="310" font-size="28" font-weight="bold">-1.30%</text><text x="451" y="338" font-size="15" fill="#dce3ff">5,594.27(9:13 기준)</text><rect x="790" y="236" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="268" font-size="17" fill="#101e3c">美 필라델피아반도체지수</text><text x="814" y="310" font-size="28" font-weight="bold" fill="#101e3c">-3.83%</text><text x="814" y="338" font-size="15" fill="#1a2c58">8거래일 연속 하락</text><rect x="64" y="380" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="416" font-size="19">마이크론 -5.63% · 브로드컴 -4.52% · AMD -5.95% · SK하이닉스ADR -6.58% · 코어위브 -11.91%</text><text x="88" y="450" font-size="19">삼성전자·SK하이닉스 4월 이후 최저 시가로 출발 · 외국인·기관 저가매수세 유입</text><text x="64" y="524" font-size="19" fill="#c5d1e7">중국 메모리반도체 공급 확대 우려 · 러시아·우크라이나 에너지시설 공격발 유가 상승도 부담</text><text x="64" y="554" font-size="19" fill="#c5d1e7">16일 2.05% 반등 하루 만에 재급락 · 다음주 예상범위(5,100~6,100선) 하단에 근접</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 글로벌이코노믹·머니투데이·뉴스핌·아시아경제 등 보도(2026.10.19) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 19일 수치는 장 초반(오전 9시대) 기준이며 종가는 미반영</text></g></svg>
