<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="36" font-weight="bold">코스피, 2%대 급등 반납하며 강보합</text><text x="64" y="196" font-size="24" fill="#c5d1e7">9.22 개장 7,161 → 장중 6,986 → 종가 7,017.91(+0.15%)</text><rect x="64" y="240" width="500" height="88" rx="8" fill="#3863f5"/><text x="88" y="272" font-size="18">개인 순매도</text><text x="88" y="308" font-size="27" font-weight="bold">1조6,089억원</text><rect x="588" y="240" width="548" height="88" rx="8" fill="#8299d4"/><text x="612" y="272" font-size="18">추석 연휴 금융지원 규모</text><text x="612" y="308" font-size="27" font-weight="bold">총 103조원</text><rect x="64" y="352" width="1072" height="72" rx="8" fill="#1a2c58"/><text x="88" y="396" font-size="22">국내 증시 9.24~27 휴장, 28일 재개 · 美 증시는 24·25일 정상 개장(갭 출발 유의)</text><text x="64" y="462" font-size="22" fill="#c5d1e7">대출 만기 연휴 중 도래 시 연체이자 없이 28일로 자동 연장</text><text x="64" y="496" font-size="22" fill="#c5d1e7">이동점포 11곳·탄력점포 11곳 운영(12개 은행, 고속道·공항 등)</text><text x="64" y="580" font-size="19" fill="#c5d1e7">출처: 한국거래소(KRX)·금융위원회 2026.09.22 발표 · 자체 제작</text><text x="64" y="608" font-size="19" fill="#c5d1e7">정보 제공용 · 투자 판단과 책임은 투자자 본인에게 있습니다</text></g></svg>
