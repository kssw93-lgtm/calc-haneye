<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 세금·부동산</text><text x="64" y="150" font-size="32" font-weight="bold">프리랜서 원천징수세율, 28년 만에 인하</text><text x="64" y="196" font-size="22" fill="#c5d1e7">3.3%→2.2%로…국회 통과 전제, 적용은 2027년 1월 소득분 목표</text><rect x="64" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="268" font-size="17">현행 원천징수세율</text><text x="88" y="310" font-size="28" font-weight="bold">3.3%</text><text x="88" y="338" font-size="15" fill="#dce3ff">소득세 3%+지방소득세 0.3%</text><rect x="427" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="268" font-size="17">개편안 원천징수세율</text><text x="451" y="310" font-size="28" font-weight="bold">2.2%</text><text x="451" y="338" font-size="15" fill="#dce3ff">소득세 2%+지방소득세 0.2%</text><rect x="790" y="236" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="268" font-size="17" fill="#101e3c">연소득 4,500만원 기준</text><text x="814" y="306" font-size="24" font-weight="bold" fill="#101e3c">연 49만5천원↓</text><text x="814" y="338" font-size="15" fill="#1a2c58">미리 떼이는 금액 감소분</text><rect x="64" y="380" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="416" font-size="19">대상: 배달라이더·대리운전기사·캐디·방송작가 등 인적용역 사업소득자(N잡러·프리랜서)</text><text x="88" y="450" font-size="19">월 380만원(연 4,500만원) 기준 원천징수액 148만5천원 → 99만원으로 감소</text><text x="64" y="524" font-size="19" fill="#c5d1e7">이형일 경제부총리, "직장인에게 전가 아니다…근로소득세와는 별개 제도" (10.6)</text><text x="64" y="554" font-size="19" fill="#c5d1e7">주의: 미리 떼는 돈만 줄 뿐 최종 세금 아님 · 저소득자는 환급 감소, 고소득자는 5월 추가납부 가능</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 기획재정부 세법개정안·파이낸셜뉴스 등 보도(2026.10.1~6) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 국회 심의 결과에 따라 세율·시행 시기가 달라질 수 있습니다</text></g></svg>
