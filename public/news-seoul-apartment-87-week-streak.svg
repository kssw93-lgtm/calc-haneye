<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 세금·부동산</text><text x="64" y="150" font-size="32" font-weight="bold">서울 아파트값, 87주 연속 상승 '역대 최장'</text><text x="64" y="196" font-size="22" fill="#c5d1e7">강남은 9주째 하락, 금천·관악·구로는 더 뛰었다</text><rect x="64" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="268" font-size="17">서울 아파트 매매가 주간 변동률</text><text x="88" y="310" font-size="28" font-weight="bold">+0.12%</text><text x="88" y="338" font-size="15" fill="#dce3ff">전주 +0.09%보다 확대</text><rect x="427" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="268" font-size="17">연속 상승 기간</text><text x="451" y="310" font-size="28" font-weight="bold">87주</text><text x="451" y="338" font-size="15" fill="#dce3ff">2012년 집계 이래 역대 최장(종전 85주)</text><rect x="790" y="236" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="268" font-size="17" fill="#101e3c">강남구·서초구</text><text x="814" y="306" font-size="24" font-weight="bold" fill="#101e3c">9주 연속 하락</text><text x="814" y="338" font-size="15" fill="#1a2c58">낙폭은 축소(-0.56%→-0.34%)</text><rect x="64" y="380" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="416" font-size="19">강남구 -0.34% · 서초구 -0.27% · 송파구 -0.19%(보합) · 용산구 -0.01%(2주째 하락)</text><text x="88" y="450" font-size="19">'금관구' 상승폭 확대: 금천구 0.25%→0.34% · 관악구 0.21%→0.33% · 구로구 0.20%→0.28%</text><text x="64" y="524" font-size="19" fill="#c5d1e7">서울 전셋값 +0.16%(매매가 상승폭 상회) · 경기도 아파트값 0.15%→0.18%로 확대</text><text x="64" y="554" font-size="19" fill="#c5d1e7">주간 가격지수는 표본 단지 호가·실거래 가중평균 · 실제 거래량 회복을 뜻하지는 않음</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 한국부동산원 주간아파트가격동향(2026.10.8 발표, 10.5 기준) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 특정 지역·단지에 대한 투자나 매수를 권유하지 않습니다</text></g></svg>
