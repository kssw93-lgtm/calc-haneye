<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="32" font-weight="bold">보이스피싱 '코인' 피해도 돌려받는다</text><text x="64" y="196" font-size="22" fill="#c5d1e7">10월 1일 '전기통신금융사기 피해자산 환급법' 시행</text><rect x="64" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="268" font-size="17">시행일</text><text x="88" y="310" font-size="28" font-weight="bold">2026.10.1</text><text x="88" y="338" font-size="15" fill="#dce3ff">공포(3.31) 후 6개월만</text><rect x="427" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="268" font-size="17">핵심 변화</text><text x="451" y="306" font-size="22" font-weight="bold">가상자산 포함</text><text x="451" y="338" font-size="15" fill="#dce3ff">거래소도 '금융회사등'으로</text><rect x="790" y="236" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="268" font-size="17" fill="#101e3c">소급 적용</text><text x="814" y="306" font-size="22" font-weight="bold" fill="#101e3c">기존 피해자도</text><text x="814" y="338" font-size="15" fill="#1a2c58">10.1 이전 피해도 신청 가능</text><rect x="64" y="380" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="416" font-size="19">가상자산거래소 의무: 거래목적 확인 · 의심거래 상시감시 · 즉시 지급정지 · ASAP 정보공유</text><text x="88" y="450" font-size="19">환급: 금전→금액 단위, 가상자산→종류·수량 단위 · 거래 미경험자는 전담기관 매도지원 후 현금 지급</text><text x="64" y="524" font-size="19" fill="#c5d1e7">국회 통과 3.12 → 공포 3.31 → 시행 10.1 (「전기통신금융사기 피해 방지 및 피해자산 환급에 관한 특별법」)</text><text x="64" y="554" font-size="19" fill="#c5d1e7">피해 의심 시 즉시 112(경찰)·1332(금감원)에 신고해 지급정지부터 받아야 합니다</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 금융위원회·전기통신금융사기 피해방지 특별법 개정 관련 보도(2026.3~10) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 실제 신청 절차와 구제 범위는 개별 사안에 따라 다를 수 있습니다</text></g></svg>
