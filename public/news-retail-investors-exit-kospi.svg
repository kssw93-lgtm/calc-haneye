<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="32" font-weight="bold">국장 등진 개미들, 美주식으로</text><text x="64" y="196" font-size="22" fill="#c5d1e7">3분기 국내주식 5.6조 팔고 美주식 10조 담았다</text><rect x="64" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="268" font-size="17">3분기 국내주식 순매도</text><text x="88" y="310" font-size="28" font-weight="bold">5조5,902억원</text><text x="88" y="338" font-size="15" fill="#dce3ff">7~9월 유가증권시장</text><rect x="427" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="268" font-size="17">3분기 美주식 순매수</text><text x="451" y="310" font-size="26" font-weight="bold">10조1,468억원</text><text x="451" y="338" font-size="15" fill="#dce3ff">76억3,224만달러</text><rect x="790" y="236" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="268" font-size="17" fill="#101e3c">9월 한 달 순매도</text><text x="814" y="310" font-size="28" font-weight="bold" fill="#101e3c">14조1,970억원</text><text x="814" y="338" font-size="15" fill="#1a2c58">2달치 매수세를 한 달 만에 역전</text><rect x="64" y="380" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="416" font-size="19">상반기(1~6월)엔 정반대: 국내주식 99조1,737억원 순매수, 美주식의 8배 규모</text><text x="88" y="450" font-size="19">10월 1~8일엔 국내주식 약 3조원 재매수 · 3분기 매도 물량 되돌리기엔 역부족 평가</text><text x="64" y="524" font-size="19" fill="#c5d1e7">국내 증시 숨 고르기·차익실현 매물 + 美 빅테크·반도체 실적 모멘텀 부각이 배경으로 거론</text><text x="64" y="554" font-size="19" fill="#c5d1e7">해외주식 양도차익은 연 250만원 공제 후 22% 분리과세 · 환전수수료·환율 변동 함께 고려 필요</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 한국거래소·한국예탁결제원 자료·서울경제 등 보도(2026.10.11) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 특정 종목이나 시장에 대한 투자를 권유하지 않습니다</text></g></svg>
