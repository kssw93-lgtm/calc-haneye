<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="34" font-weight="bold">추석 연휴 첫날, 택배·과태료 문자 비상</text><text x="64" y="196" font-size="22" fill="#c5d1e7">금융위·금감원 스미싱·보이스피싱 주의보(9.20)</text><rect x="64" y="240" width="500" height="96" rx="8" fill="#3863f5"/><text x="88" y="272" font-size="18">9.1~21 위험문자 탐지(에버스핀)</text><text x="88" y="312" font-size="30" font-weight="bold">1,381건</text><rect x="588" y="240" width="548" height="96" rx="8" fill="#8299d4"/><text x="612" y="272" font-size="18">유형별 비중</text><text x="612" y="308" font-size="22" font-weight="bold">기관사칭·악성앱유도 65.4% · 개인정보탈취 31.0%</text><rect x="64" y="360" width="1072" height="72" rx="8" fill="#1a2c58"/><text x="88" y="404" font-size="22">전화 가로채기형 3.6% · 출처불명 URL은 절대 클릭 금지, 공식 앱·대표번호로 직접 확인</text><text x="64" y="470" font-size="20" fill="#c5d1e7">명의도용 우려 시 '금융거래 안심차단서비스'로 대출·계좌 개설 사전 차단</text><text x="64" y="500" font-size="20" fill="#c5d1e7">피해 의심 시 112(경찰)·1394(금감원 보이스피싱 상담) 즉시 신고</text><text x="64" y="580" font-size="19" fill="#c5d1e7">출처: 금융위원회·금융감독원, 에버스핀 탐지 데이터(2026.9) · 자체 제작</text><text x="64" y="608" font-size="19" fill="#c5d1e7">정보 제공용 · 실제 피해 건수와 수법은 연휴 기간 중 달라질 수 있습니다</text></g></svg>
