<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="32" font-weight="bold">코스피, 8거래일 만에 반등해 5,668선 마감</text><text x="64" y="196" font-size="22" fill="#c5d1e7">외국인 9거래일 만에 순매수 전환</text><rect x="64" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="268" font-size="17">10.16 종가</text><text x="88" y="310" font-size="28" font-weight="bold">5,668.05</text><text x="88" y="338" font-size="15" fill="#dce3ff">전일比 +113.83(+2.05%)</text><rect x="427" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="268" font-size="17">외국인 수급</text><text x="451" y="310" font-size="28" font-weight="bold">9거래일만 순매수</text><text x="451" y="338" font-size="15" fill="#dce3ff">약 +3,430억원(추정)</text><rect x="790" y="236" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="268" font-size="17" fill="#101e3c">이번 주 하락폭</text><text x="814" y="310" font-size="28" font-weight="bold" fill="#101e3c">-14.46%</text><text x="814" y="338" font-size="15" fill="#1a2c58">10.8 대비 -957.88p</text><rect x="64" y="380" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="416" font-size="19">코스닥 794.78(+4.46%) 동반 상승 · 삼성전자 +2.61% 21만5,500원 · 개인·기관은 이날도 순매도</text><text x="88" y="450" font-size="19">외국인, 10.2~15 8거래일간 18조1,311억원 순매도 후 16일 매수 전환 · 개인·기관 매도 지속</text><text x="64" y="524" font-size="19" fill="#c5d1e7">8일~16일 한 주간 957.88포인트(14.46%) 하락 · 하루 반등만으로 메우긴 이른 낙폭이라는 신중론</text><text x="64" y="554" font-size="19" fill="#c5d1e7">다음 주(19일~) 예상 등락범위 5,100~6,100선 제시 · 3분기 실적과 외국인 수급 지속 여부가 관건</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 아시아경제·머니투데이·디지털데일리 등 보도(2026.10.16~17) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 특정 종목·시장에 대한 투자 권유 아님</text></g></svg>
