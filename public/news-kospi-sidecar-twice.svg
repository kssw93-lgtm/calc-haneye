<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="32" font-weight="bold">코스피, 이틀 만에 또 사이드카</text><text x="64" y="196" font-size="22" fill="#c5d1e7">개장 직후 5%대 급락…6000선 또 무너져</text><rect x="64" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="268" font-size="17">10.15 개장 직후 하락률</text><text x="88" y="310" font-size="28" font-weight="bold">-5%대</text><text x="88" y="338" font-size="15" fill="#dce3ff">5,670선 안팎 출발(전일 6,008.81)</text><rect x="427" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="268" font-size="17">사이드카 발동 시각</text><text x="451" y="306" font-size="24" font-weight="bold">오전 9시 7분</text><text x="451" y="338" font-size="15" fill="#dce3ff">코스닥도 9시 12분경 발동</text><rect x="790" y="236" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="268" font-size="17" fill="#101e3c">올해 코스피 사이드카</text><text x="814" y="310" font-size="28" font-weight="bold" fill="#101e3c">50번째</text><text x="814" y="338" font-size="15" fill="#1a2c58">13일 발동 기준, 26번째 매도 사이드카</text><rect x="64" y="380" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="416" font-size="19">10.13 사이드카: 코스피 6000선 붕괴 · 외국인 1조4,784억 순매도, 개인·기관 순매수</text><text x="88" y="450" font-size="19">배경: 반도체 공급 우려 · AI 설비투자 수익성 논란 · 레버리지 거래가 낙폭 확대</text><text x="64" y="524" font-size="19" fill="#c5d1e7">사이드카는 서킷브레이커와 달리 프로그램 매도호가 효력만 5분간 정지 · 일반 매매는 계속</text><text x="64" y="554" font-size="19" fill="#c5d1e7">15일 종가 등 이후 집계되는 수치는 미반영 · 변동성 장세엔 레버리지 상품 손익 폭 확대 유의</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 한국거래소·아시아투데이·MBC뉴스 등 보도(2026.10.13~15) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 특정 종목이나 시장에 대한 투자를 권유하지 않습니다</text></g></svg>
