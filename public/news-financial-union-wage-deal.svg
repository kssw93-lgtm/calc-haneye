<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="32" font-weight="bold">은행 문, 내년 4월부터 30분 늦게 연다</text><text x="64" y="196" font-size="22" fill="#c5d1e7">금융 노사 잠정합의로 30일 2차 총파업 철회</text><rect x="64" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="268" font-size="17">영업시간(2027.4~)</text><text x="88" y="310" font-size="28" font-weight="bold">30분 단축</text><text x="88" y="338" font-size="15" fill="#dce3ff">개점 9시 → 9시30분(마감 4시 유지)</text><rect x="427" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="268" font-size="17">총액임금 인상률</text><text x="451" y="310" font-size="28" font-weight="bold">3.0%↑</text><text x="451" y="338" font-size="15" fill="#dce3ff">5개월 교섭 끝에 잠정합의</text><rect x="790" y="236" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="268" font-size="17" fill="#101e3c">9.30 2차 총파업</text><text x="814" y="310" font-size="28" font-weight="bold" fill="#101e3c">철회</text><text x="814" y="338" font-size="15" fill="#1a2c58">9.4 1차 총파업 이후 타결</text><rect x="64" y="380" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="416" font-size="19">금요일 '라스트콜' 고객마감제 신설 · 일·생활 균형 자율출근제(주 1시간 이내) 도입</text><text x="88" y="450" font-size="19">육아휴직 대상 자녀연령 초등 6학년까지 확대 · 저학년 자녀 근무시간 조정제도 연장</text><text x="64" y="524" font-size="19" fill="#c5d1e7">9월 28일 산별중앙교섭 잠정합의 도출(4.13 첫 교섭 이후 약 5개월 만)</text><text x="64" y="554" font-size="19" fill="#c5d1e7">29일 지부대표자회의 후 조합원 찬반투표 등 절차를 거쳐야 최종 타결 확정</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 전국금융산업노동조합·금융산업사용자협의회 잠정합의(2026.9.28) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 잠정합의 단계로 최종 시행 여부·일정은 달라질 수 있습니다</text></g></svg>
