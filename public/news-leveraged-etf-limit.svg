<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="32" font-weight="bold">레버리지 ETF 손실 논란에 금융위 초강수</text><text x="64" y="196" font-size="22" fill="#c5d1e7">개인 투자한도 20% 제한·모의거래 의무화 추진</text><rect x="64" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="268" font-size="17">개인 투자한도(예시안)</text><text x="88" y="310" font-size="28" font-weight="bold">총자산의 20%</text><text x="88" y="338" font-size="15" fill="#dce3ff">자본시장법 개정으로 근거 마련</text><rect x="427" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="268" font-size="17">SK하이닉스 레버리지 ETF</text><text x="451" y="310" font-size="28" font-weight="bold">고점比 -65%</text><text x="451" y="338" font-size="15" fill="#dce3ff">'음의 복리' 손실 누적</text><rect x="790" y="236" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="268" font-size="17" fill="#101e3c">1차 규제 후 거래대금</text><text x="814" y="310" font-size="28" font-weight="bold" fill="#101e3c">-86.7~92%</text><text x="814" y="338" font-size="15" fill="#1a2c58">기본예탁금 3천만원 상향(7.31)</text><rect x="64" y="380" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="416" font-size="19">5.27 삼성전자·SK하이닉스 단일종목 레버리지·인버스 ETF 상장 → 7.31 1차 규제(기본예탁금 상향)</text><text x="88" y="450" font-size="19">9.29 밤 긴급 시장상황점검회의 → 9.30 투자한도·모의거래 의무화·과다호가부담금 등 추가조치 발표</text><text x="64" y="524" font-size="19" fill="#c5d1e7">삼성전자 5.27~7.15 -8.96%일 때 레버리지 ETF 평균 -30.66%, SK하이닉스는 -7.18%일 때 -34.06%</text><text x="64" y="554" font-size="19" fill="#c5d1e7">홍콩 증권선물위원회(SFC)의 가변 레버리지 배율 지침을 참조 사례로 검토 중</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 금융위원회 단일종목 레버리지 상품 추가조치(2026.9.30) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 세부 시행 시기와 기준은 확정 전이며 특정 상품 투자를 권유하지 않습니다</text></g></svg>
