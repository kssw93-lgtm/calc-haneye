<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="32" font-weight="bold">내일(28일) 코스피 재개장, 관전 포인트</text><text x="64" y="196" font-size="22" fill="#c5d1e7">미중 무역휴전 2개월 연장 속 반도체 대형주 향방 주목</text><rect x="64" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="88" y="268" font-size="17">코스피 9.23 종가(연휴 전)</text><text x="88" y="310" font-size="28" font-weight="bold">7,080.92</text><text x="88" y="338" font-size="15" fill="#dce3ff">전일比 +0.90%(+63.01p)</text><rect x="427" y="236" width="345" height="120" rx="8" fill="#3863f5"/><text x="451" y="268" font-size="17">9.1~20 반도체 수출</text><text x="451" y="310" font-size="28" font-weight="bold">341억달러</text><text x="451" y="338" font-size="15" fill="#dce3ff">사상 첫 300억달러 돌파</text><rect x="790" y="236" width="346" height="120" rx="8" fill="#8299d4"/><text x="814" y="268" font-size="17" fill="#101e3c">美 필라델피아반도체(9.25)</text><text x="814" y="310" font-size="28" font-weight="bold" fill="#101e3c">+1.13%</text><text x="814" y="338" font-size="15" fill="#1a2c58">3거래일 연속 강세 마감</text><rect x="64" y="380" width="1072" height="96" rx="8" fill="#1a2c58"/><text x="88" y="416" font-size="19">美中 정상회담(9.24, 백악관) 무역휴전 2027.1.10까지 2개월 연장 · 美 펜타닐관세 10%p 인하</text><text x="88" y="450" font-size="19">삼성전자 9.23 종가 28만5,500원(+3.25%) · SK하이닉스 186만원(+1.20%)</text><text x="64" y="524" font-size="19" fill="#c5d1e7">최근 10년 명절 직후 5거래일 코스피 평균 +1.07%(21회 중 12회 상승)</text><text x="64" y="554" font-size="19" fill="#c5d1e7">연휴 전 5거래일 상승 마감 시(14회)엔 평균 +1.42%로 더 높았음</text><text x="64" y="600" font-size="18" fill="#c5d1e7">출처: 한국거래소(KRX)·산업통상부·백악관 발표(2026.9) · 자체 제작</text><text x="64" y="624" font-size="18" fill="#c5d1e7">정보 제공용 · 실제 등락은 외국인 수급과 해외 시장 상황에 따라 달라질 수 있습니다</text></g></svg>
