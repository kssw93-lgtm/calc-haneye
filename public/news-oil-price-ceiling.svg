<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="38" font-weight="bold">10차 석유 최고가격, 9차와 동일 동결</text><text x="64" y="196" font-size="24" fill="#c5d1e7">9.19 0시부터 4주간 적용 · 중동 정세 재악화 속 결정</text><rect x="64" y="240" width="345" height="88" rx="8" fill="#3863f5"/><text x="88" y="272" font-size="18">휘발유</text><text x="88" y="308" font-size="27" font-weight="bold">1,784원/L</text><rect x="427" y="240" width="345" height="88" rx="8" fill="#3863f5"/><text x="451" y="272" font-size="18">경유</text><text x="451" y="308" font-size="27" font-weight="bold">1,773원/L</text><rect x="790" y="240" width="346" height="88" rx="8" fill="#8299d4"/><text x="814" y="272" font-size="18">등유</text><text x="814" y="308" font-size="27" font-weight="bold">1,380원/L</text><rect x="64" y="352" width="1072" height="72" rx="8" fill="#1a2c58"/><text x="88" y="396" font-size="24">정유사→주유소 공급가 상한 · 1997년 유가자유화 이후 첫 시행(2026.3.13)</text><text x="64" y="462" font-size="22" fill="#c5d1e7">9.16 기준 두바이유 128.0달러·브렌트유 105.8달러·WTI 102.4달러로 재급등</text><text x="64" y="496" font-size="22" fill="#c5d1e7">소비자 실제 주유소 판매가와는 차이가 있을 수 있음</text><text x="64" y="580" font-size="19" fill="#c5d1e7">출처: 산업통상부 2026.09.18 발표 · 자체 제작</text><text x="64" y="608" font-size="19" fill="#c5d1e7">정보 제공용 · 특정 주유소 이용을 권유하지 않습니다</text></g></svg>
