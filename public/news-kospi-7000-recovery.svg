<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="24" fill="#101e3c"/><g font-family="Malgun Gothic, sans-serif" fill="white"><text x="64" y="78" font-size="24" fill="#a6bfff">계산한눈에 · 금융뉴스</text><text x="64" y="150" font-size="38" font-weight="bold">코스피, 열흘 만에 7000선 회복</text><text x="64" y="196" font-size="24" fill="#c5d1e7">9.21 종가 7,007.72(+1.65%) · 역대 최고치는 아님(5.6 기록)</text><rect x="64" y="240" width="500" height="88" rx="8" fill="#3863f5"/><text x="88" y="272" font-size="18">삼성전자</text><text x="88" y="308" font-size="27" font-weight="bold">+4.98%</text><rect x="588" y="240" width="548" height="88" rx="8" fill="#8299d4"/><text x="612" y="272" font-size="18">9.1~20 반도체 수출</text><text x="612" y="308" font-size="27" font-weight="bold">341억달러(+259.4%)</text><rect x="64" y="352" width="1072" height="72" rx="8" fill="#1a2c58"/><text x="88" y="396" font-size="22">기관 1조4,923억원 순매수 vs 개인 2조9,789억·외국인 1,602억원 순매도</text><text x="64" y="462" font-size="22" fill="#c5d1e7">9월 1~20일 전체 수출 714억달러, 전년동기比 +78.3%(역대 최대)</text><text x="64" y="496" font-size="22" fill="#c5d1e7">코스피 역대 최고 종가는 7,384.56(5.6) · 장중 최고 7,426.60</text><text x="64" y="580" font-size="19" fill="#c5d1e7">출처: 한국거래소(KRX)·관세청 2026.09.21 발표 · 자체 제작</text><text x="64" y="608" font-size="19" fill="#c5d1e7">정보 제공용 · 투자 판단과 책임은 투자자 본인에게 있습니다</text></g></svg>
